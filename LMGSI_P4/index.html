<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Movie Database (TMDB)</title>
    <meta name="description" content="Aquesta web és una versió simplificada de TMDB.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
    <header>
        <a href="https://www.themoviedb.org/?language=es" target="_blank">
            <img id="logo" src="images/logo.svg" alt="Logo de la web.">
        </a>

        <nav>
            <ul>
                <li><a href="search.html" target="_blank">Buscador</a></li>
                <li><a href="contact.html" target="_blank">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="search-block">
            <h1>BUSCA UNA PEL·LÍCULA</h1>
            <p>Milions de títols, un sol cercador.</p>

            <form id="search-movie" method="get" action="https://www.themoviedb.org/search">
                <input type="search" id="query" name="query" placeholder="Cerca una pel·lícula, per exemple «Dragon Ball»..." required>
                <button type="submit">Cercar</button>
            </form>
        </section>

        <section class="movies-block">
            <h2>Resultats</h2>

            <article class="card-movie">
                <div>
                    <img class="movie-image" src="images/social_network.webp" alt="Poster de la pel·lícula (The Social Network)">
                    <h3>The Social Network</h3>
                    <p>2010</p>
                </div>
            </article>

            <article class="card-movie">
                <div>
                    <img class="movie-image" src="images/dragonball.webp" alt="Poster de la pel·lícula (Dragon Ball Super: Broly)">
                    <h3>Dragon Ball Super: Broly</h3>
                    <p>2018</p>
                </div>
            </article>

            <article class="card-movie">
                <div>
                    <img class="movie-image" src="images/spiderman.webp" alt="Poster de la pel·lícula (Spider-Man: Brand New Day)">
                    <h3>Spider-Man: Brand New Day</h3>
                    <p>2026</p>
                </div>
            </article>
        </section>
    </main>

    <footer>© 2026 The Movie Database - Maqueta de disseny</footer>
</body>
</html>
